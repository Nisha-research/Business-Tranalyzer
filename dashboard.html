<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Dashboard - Analytics & Forecasting</title>
    <link rel="icon" href="file:///C:/Users/Nisha/OneDrive/Pictures/Screenshots/Screenshot%202025-10-04%20192010.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: white; border-radius: 12px; padding: 20px 30px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.8rem; color: #333; }
        .back-btn { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .back-btn:hover { background: #5568d3; transform: translateY(-2px); }
        .controls { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .controls-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 0.85rem; font-weight: 600; color: #555; }
        .control-group select, .control-group input { padding: 8px 12px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 0.95rem; transition: border-color 0.3s; }
        .control-group select:focus, .control-group input:focus { outline: none; border-color: #667eea; }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; position: relative; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #10b981; color: white; }
        .btn-secondary:hover { background: #059669; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; transform: translateY(-2px); }
        .btn-info { background: #3b82f6; color: white; }
        .btn-info:hover { background: #2563eb; transform: translateY(-2px); }

        .tooltip { visibility: hidden; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; white-space: nowrap; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -5px; border-width: 5px; border-style: solid; border-color: #1f2937 transparent transparent transparent; }
        .btn:hover .tooltip { visibility: visible; opacity: 1; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 0.85rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: #667eea; }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .chart-card h3 { font-size: 1.2rem; color: #333; margin-bottom: 15px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
        .chart-container { position: relative; height: 400px; }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .controls-row { flex-direction: column; align-items: stretch; }
            .chart-container { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Business Analytics Dashboard</h1>
            <button class="back-btn" onclick="goBack()">← Back to Tracker</button>
        </header>

        <div class="controls">
            <div class="controls-row">
                <div class="control-group">
                    <label for="metricSelect">Metric</label>
                    <select id="metricSelect">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                        <option value="balance">Balance</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="rangeSelect">Time Range</label>
                    <select id="rangeSelect">
                        <option value="week">Weekly</option>
                        <option value="month" selected>Monthly</option>
                        <option value="quarter">Quarterly</option>
                        <option value="year">Yearly</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="categorySelect">Category Filter</label>
                    <select id="categorySelect">
                        <option value="all">All Categories</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="forecastPeriods">Forecast Periods</label>
                    <input type="number" id="forecastPeriods" min="1" max="24" value="6" style="width: 80px;">
                </div>

                <div class="control-group" style="flex-direction: row; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="updateCharts()">
                        Refresh Charts
                        <span class="tooltip">Update all charts with current data and filters</span>
                    </button>
                    <button class="btn btn-secondary" onclick="addPresent()">
                        Add Present
                        <span class="tooltip">Add current month/period data to the forecast baseline</span>
                    </button>
                    <button class="btn btn-secondary" onclick="applyPresent()">
                        Apply Present
                        <span class="tooltip">Apply accumulated present data to update the forecast model</span>
                    </button>
                    <button class="btn btn-warning" onclick="runSampleTest()">
                        Run Sample Test
                        <span class="tooltip">Generate sample transactions to test the dashboard features</span>
                    </button>
                    <button class="btn btn-info" onclick="forecastDebug()">
                        Forecast Debug
                        <span class="tooltip">Show detailed forecast calculations and model parameters</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="statsSection" class="stats"></div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 Trend Analysis</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>🔮 Forecast Projection</h3>
                <div class="chart-container">
                    <canvas id="forecastChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>📊 Category Breakdown</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>🎯 Comparison View</h3>
                <div class="chart-container">
                    <canvas id="comparisonChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let transactions = [];
        let trendChart, forecastChart, categoryChart, comparisonChart;
        let presentData = [];

        function init() {
            try {
                const stored = sessionStorage.getItem('summary_transactions_temp');
                if (stored) {
                    transactions = JSON.parse(stored);
                    sessionStorage.removeItem('summary_transactions_temp');
                }

                const presentStored = localStorage.getItem('forecast_present_data');
                if (presentStored) {
                    presentData = JSON.parse(presentStored);
                }

                const favicon = sessionStorage.getItem('summary_dashboard_favicon');
                if (favicon) {
                    const link = document.createElement('link');
                    link.rel = 'icon';
                    link.href = favicon;
                    document.head.appendChild(link);
                }

                populateCategoryFilter();
                updateCharts();
            } catch (e) {
                console.error('Init error:', e);
                alert('Error loading data: ' + e.message);
            }
        }

        function goBack() {
            window.history.back();
        }

        function populateCategoryFilter() {
            const categories = [...new Set(transactions.map(t => t.category).filter(Boolean))];
            const select = document.getElementById('categorySelect');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function updateCharts() {
            const metric = document.getElementById('metricSelect').value;
            const range = document.getElementById('rangeSelect').value;
            const category = document.getElementById('categorySelect').value;

            let filtered = transactions;
            if (category !== 'all') {
                filtered = transactions.filter(t => t.category === category);
            }

            updateStats(filtered);
            updateTrendChart(filtered, metric, range);
            updateForecastChart(filtered, metric, range);
            updateCategoryChart(filtered);
            updateComparisonChart(filtered, range);
        }

        function updateStats(txns) {
            const income = txns.filter(t => t.type === 'income').reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            const expense = txns.filter(t => t.type === 'expense').reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            const balance = income - expense;
            const pending = txns.filter(t => t.status === 'pending').reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

            const statsHTML = `
                <div class="stat-card">
                    <h3>Total Income</h3>
                    <div class="value" style="color: #10b981;">₹${income.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Expense</h3>
                    <div class="value" style="color: #ef4444;">₹${expense.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Net Balance</h3>
                    <div class="value" style="color: ${balance >= 0 ? '#10b981' : '#ef4444'};">₹${balance.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <div class="value" style="color: #f59e0b;">₹${pending.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Transactions</h3>
                    <div class="value">${txns.length}</div>
                </div>
            `;
            document.getElementById('statsSection').innerHTML = statsHTML;
        }

        function groupByRange(txns, range, metric) {
            const groups = {};

            txns.forEach(t => {
                const date = new Date(t.date);
                let key;

                if (range === 'week') {
                    const week = getWeekNumber(date);
                    key = `${date.getFullYear()}-W${week}`;
                } else if (range === 'month') {
                    key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                } else if (range === 'quarter') {
                    const quarter = Math.floor(date.getMonth() / 3) + 1;
                    key = `${date.getFullYear()}-Q${quarter}`;
                } else {
                    key = String(date.getFullYear());
                }

                if (!groups[key]) groups[key] = { income: 0, expense: 0, balance: 0 };

                if (t.type === 'income') {
                    groups[key].income += Number(t.amount) || 0;
                } else {
                    groups[key].expense += Number(t.amount) || 0;
                }
            });

            Object.keys(groups).forEach(key => {
                groups[key].balance = groups[key].income - groups[key].expense;
            });

            const sorted = Object.keys(groups).sort();
            return {
                labels: sorted,
                values: sorted.map(k => groups[k][metric])
            };
        }

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function updateTrendChart(txns, metric, range) {
            const data = groupByRange(txns, range, metric);

            if (trendChart) trendChart.destroy();

            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: metric.charAt(0).toUpperCase() + metric.slice(1),
                        data: data.values,
                        borderColor: metric === 'income' ? '#10b981' : metric === 'expense' ? '#ef4444' : '#667eea',
                        backgroundColor: metric === 'income' ? 'rgba(16, 185, 129, 0.1)' : metric === 'expense' ? 'rgba(239, 68, 68, 0.1)' : 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function updateForecastChart(txns, metric, range) {
            const periods = parseInt(document.getElementById('forecastPeriods').value) || 6;
            const historical = groupByRange(txns, range, metric);

            const forecast = generateForecast(historical.values, periods, presentData);

            if (forecastChart) forecastChart.destroy();

            const ctx = document.getElementById('forecastChart').getContext('2d');
            const allLabels = [...historical.labels, ...forecast.labels];

            forecastChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: [
                        {
                            label: 'Historical',
                            data: [...historical.values, ...Array(periods).fill(null)],
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 5
                        },
                        {
                            label: 'Forecast',
                            data: [...Array(historical.values.length).fill(null), ...forecast.values],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 3,
                            borderDash: [10, 5],
                            tension: 0.4,
                            fill: true,
                            pointRadius: 5
                        },
                        {
                            label: 'Upper Bound',
                            data: [...Array(historical.values.length).fill(null), ...forecast.upper],
                            borderColor: 'rgba(239, 68, 68, 0.3)',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            label: 'Lower Bound',
                            data: [...Array(historical.values.length).fill(null), ...forecast.lower],
                            borderColor: 'rgba(16, 185, 129, 0.3)',
                            borderWidth: 1,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function generateForecast(historical, periods, presentAdjustment) {
            if (historical.length === 0) {
                return {
                    labels: Array(periods).fill('N/A'),
                    values: Array(periods).fill(0),
                    upper: Array(periods).fill(0),
                    lower: Array(periods).fill(0)
                };
            }

            const avg = historical.reduce((a, b) => a + b, 0) / historical.length;

            let trend = 0;
            if (historical.length > 1) {
                const n = historical.length;
                const x = Array.from({length: n}, (_, i) => i);
                const xMean = x.reduce((a, b) => a + b) / n;
                const yMean = avg;

                const numerator = x.reduce((sum, xi, i) => sum + (xi - xMean) * (historical[i] - yMean), 0);
                const denominator = x.reduce((sum, xi) => sum + Math.pow(xi - xMean, 2), 0);
                trend = denominator !== 0 ? numerator / denominator : 0;
            }

            const stdDev = Math.sqrt(historical.reduce((sum, val) => sum + Math.pow(val - avg, 2), 0) / historical.length);

            const range = document.getElementById('rangeSelect').value;
            const lastLabel = getLastLabel(range);

            const labels = [];
            const values = [];
            const upper = [];
            const lower = [];

            let presentBoost = 0;
            if (presentAdjustment.length > 0) {
                presentBoost = presentAdjustment.reduce((a, b) => a + b, 0) / presentAdjustment.length;
            }

            for (let i = 1; i <= periods; i++) {
                labels.push(getNextLabel(lastLabel, i, range));
                const base = avg + (trend * (historical.length + i));
                const boosted = base + (presentBoost * 0.3);
                const val = Math.max(0, boosted);

                values.push(val);
                upper.push(val + stdDev * 1.5);
                lower.push(Math.max(0, val - stdDev * 1.5));
            }

            return { labels, values, upper, lower };
        }

        function getLastLabel(range) {
            const now = new Date();
            if (range === 'week') {
                const week = getWeekNumber(now);
                return `${now.getFullYear()}-W${week}`;
            } else if (range === 'month') {
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            } else if (range === 'quarter') {
                const quarter = Math.floor(now.getMonth() / 3) + 1;
                return `${now.getFullYear()}-Q${quarter}`;
            } else {
                return String(now.getFullYear());
            }
        }

        function getNextLabel(current, offset, range) {
            if (range === 'week') {
                const [year, week] = current.split('-W').map(Number);
                const newWeek = week + offset;
                return `${year}-W${newWeek}`;
            } else if (range === 'month') {
                const [year, month] = current.split('-').map(Number);
                const d = new Date(year, month - 1 + offset, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            } else if (range === 'quarter') {
                const [year, q] = current.split('-Q').map(Number);
                const totalQuarters = (year * 4) + q - 1 + offset;
                const newYear = Math.floor(totalQuarters / 4);
                const newQ = (totalQuarters % 4) + 1;
                return `${newYear}-Q${newQ}`;
            } else {
                return String(parseInt(current) + offset);
            }
        }

        function updateCategoryChart(txns) {
            const categories = {};
            txns.forEach(t => {
                if (t.type !== 'expense') return;
                const cat = t.category || 'Other';
                categories[cat] = (categories[cat] || 0) + (Number(t.amount) || 0);
            });

            const labels = Object.keys(categories);
            const data = Object.values(categories);

            if (categoryChart) categoryChart.destroy();

            const ctx = document.getElementById('categoryChart').getContext('2d');
            categoryChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#667eea', '#764ba2', '#f59e0b', '#10b981',
                            '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ₹${context.parsed.toFixed(2)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateComparisonChart(txns, range) {
            const incomeData = groupByRange(txns.filter(t => t.type === 'income'), range, 'income');
            const expenseData = groupByRange(txns.filter(t => t.type === 'expense'), range, 'expense');

            const allLabels = [...new Set([...incomeData.labels, ...expenseData.labels])].sort();

            const incomeValues = allLabels.map(l => {
                const idx = incomeData.labels.indexOf(l);
                return idx !== -1 ? incomeData.values[idx] : 0;
            });

            const expenseValues = allLabels.map(l => {
                const idx = expenseData.labels.indexOf(l);
                return idx !== -1 ? expenseData.values[idx] : 0;
            });

            if (comparisonChart) comparisonChart.destroy();

            const ctx = document.getElementById('comparisonChart').getContext('2d');
            comparisonChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: allLabels,
                    datasets: [
                        {
                            label: 'Income',
                            data: incomeValues,
                            backgroundColor: 'rgba(16, 185, 129, 0.8)',
                            borderColor: '#10b981',
                            borderWidth: 2
                        },
                        {
                            label: 'Expense',
                            data: expenseValues,
                            backgroundColor: 'rgba(239, 68, 68, 0.8)',
                            borderColor: '#ef4444',
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function addPresent() {
            const metric = document.getElementById('metricSelect').value;
            const range = document.getElementById('rangeSelect').value;
            const category = document.getElementById('categorySelect').value;

            let filtered = transactions;
            if (category !== 'all') {
                filtered = transactions.filter(t => t.category === category);
            }

            const data = groupByRange(filtered, range, metric);
            if (data.values.length > 0) {
                const latest = data.values[data.values.length - 1];
                presentData.push(latest);
                localStorage.setItem('forecast_present_data', JSON.stringify(presentData));
                alert(`✓ Added present value: ₹${latest.toFixed(2)}\nTotal present adjustments: ${presentData.length}`);
            } else {
                alert('No data available to add to present baseline.');
            }
        }

        function applyPresent() {
            if (presentData.length === 0) {
                alert('No present data to apply. Use "Add Present" first.');
                return;
            }

            const avgAdjustment = presentData.reduce((a, b) => a + b, 0) / presentData.length;
            alert(`✓ Applied present data!\n\nAdjustments: ${presentData.length}\nAverage boost: ₹${avgAdjustment.toFixed(2)}\n\nThe forecast will now incorporate this baseline adjustment.`);
            updateCharts();
        }

        function runSampleTest() {
            const sampleCount = 50;
            const categories = ['ABC Shop', 'XYZ Store', 'PQR Mart', 'Bills', 'Salary'];
            const samples = [];

            for (let i = 0; i < sampleCount; i++) {
                const date = new Date();
                date.setDate(date.getDate() - Math.floor(Math.random() * 365));

                const isIncome = Math.random() > 0.7;
                samples.push({
                    id: 'sample_' + Date.now() + '_' + i,
                    description: isIncome ? 'Sample Income' : 'Sample Expense',
                    amount: Math.random() * 5000 + 500,
                    category: categories[Math.floor(Math.random() * categories.length)],
                    type: isIncome ? 'income' : 'expense',
                    status: 'paid',
                    date: date.toISOString().split('T')[0],
                    timestamp: date.getTime()
                });
            }

            transactions = [...transactions, ...samples];
            alert(`✓ Generated ${sampleCount} sample transactions!\n\nUpdating charts...`);
            updateCharts();
        }

        function forecastDebug() {
            const metric = document.getElementById('metricSelect').value;
            const range = document.getElementById('rangeSelect').value;
            const periods = parseInt(document.getElementById('forecastPeriods').value) || 6;

            const data = groupByRange(transactions, range, metric);
            const avg = data.values.length > 0 ? data.values.reduce((a, b) => a + b, 0) / data.values.length : 0;

            let trend = 0;
            if (data.values.length > 1) {
                const n = data.values.length;
                const x = Array.from({length: n}, (_, i) => i);
                const xMean = x.reduce((a, b) => a + b) / n;

                const numerator = x.reduce((sum, xi, i) => sum + (xi - xMean) * (data.values[i] - avg), 0);
                const denominator = x.reduce((sum, xi) => sum + Math.pow(xi - xMean, 2), 0);
                trend = denominator !== 0 ? numerator / denominator : 0;
            }

            const stdDev = data.values.length > 0
                ? Math.sqrt(data.values.reduce((sum, val) => sum + Math.pow(val - avg, 2), 0) / data.values.length)
                : 0;

            const presentBoost = presentData.length > 0
                ? presentData.reduce((a, b) => a + b, 0) / presentData.length
                : 0;

            const debugInfo = `
🔍 FORECAST DEBUG INFORMATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📊 Model Parameters:
   • Metric: ${metric.toUpperCase()}
   • Time Range: ${range}
   • Forecast Periods: ${periods}
   • Historical Data Points: ${data.values.length}

📈 Statistical Analysis:
   • Mean (μ): ₹${avg.toFixed(2)}
   • Trend (β): ₹${trend.toFixed(2)} per period
   • Std Deviation (σ): ₹${stdDev.toFixed(2)}
   • Present Boost: ₹${presentBoost.toFixed(2)}

🔮 Forecast Formula:
   F(t) = μ + β×t + (boost × 0.3)

   Where:
   • F(t) = Forecast value at time t
   • μ = Historical mean
   • β = Linear trend coefficient
   • t = Period number
   • boost = Present data adjustment

📉 Confidence Intervals:
   • Upper: F(t) + 1.5σ
   • Lower: max(0, F(t) - 1.5σ)

🎯 Algorithm: Linear Regression + Moving Average
   Present adjustments: ${presentData.length}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            `.trim();

            alert(debugInfo);
            console.log(debugInfo);
            console.log('Historical Values:', data.values);
            console.log('Present Data:', presentData);
        }

        window.onload = init;
    </script>
</body>
</html>
